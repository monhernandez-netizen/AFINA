<!-- CONTENIDO: lo que se edita (palabras, niveles, letras) -->
<script src="contenido/config.js"></script>
<script src="contenido/palabras.js"></script>
<script src="contenido/letras.js"></script>

<script src="js/nucleo/audio.js"></script>
<script src="js/nucleo/ui.js"></script>
<script src="js/nucleo/pantallas.js"></script>

<script src="js/tipos/contar-sonidos.js"></script>
<script src="js/tipos/letra-inicial.js"></script>
<script src="js/tipos/unir-igual.js"></script>

<script src="js/tipos/sonido-escondido.js"></script>

<script src="js/nucleo/validar.js"></script>
<script src="js/nucleo/revisar.js"></script>
<script src="js/app.js"></script>

<!-- Versión instalable y sin conexión (guarda la app en el dispositivo la primera vez) -->
<script>
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

</html>
